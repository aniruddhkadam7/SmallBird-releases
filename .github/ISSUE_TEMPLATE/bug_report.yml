name: Bug report
description: Report a problem with installing, updating, or running Smallbird
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. This repository covers the Windows
        and Mac installers and app releases — for account, billing, or website issues, please email
        support@smallbird.in instead.
  - type: input
    id: version
    attributes:
      label: Smallbird version
      description: Found under Account → Settings in the app.
      placeholder: "e.g. 0.1.9"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Windows 11 23H2, 64-bit — or macOS 15.2, Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
